
name: Build and Publish Halal-Bazaar

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: |
            VITE_ORDER_CURRENCY=PKR
            VITE_SUPPORT_EMAIL=${{ vars.VITE_SUPPORT_EMAIL }}
            VITE_FIREBASE_API_KEY=${{ vars.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_APP_ID=${{ vars.VITE_FIREBASE_APP_ID }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_MEASUREMENT_ID=${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
            VITE_FIREBASE_MESSAGING_SENDER_ID=${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_PROJECT_ID=${{ vars.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_STORAGE_BUCKET=${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
            VITE_FIRESTORE_DATABASE_ID=${{ vars.VITE_FIRESTORE_DATABASE_ID }}

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate deployment configuration
        shell: bash
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail

          if [[ ! "$EC2_INSTANCE_ID" =~ ^i-[a-f0-9]+$ ]]; then
            echo "Invalid EC2_INSTANCE_ID."
            exit 1
          fi

          if [[ "$AWS_REGION" != "ap-southeast-2" ]]; then
            echo "Unexpected AWS region: $AWS_REGION"
            exit 1
          fi

          echo "Deployment configuration validated."

      - name: Deploy through AWS Systems Manager
        shell: bash
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/bilaal-ahmed/halal-bazaar:${IMAGE_TAG}"

          PARAMS=$(jq -n --arg image "$IMAGE" '{
            commands: [
              "set -eu",
              ("docker pull " + $image),
              "docker rm -f halal-bazaar || true",
              ("docker run -d --name halal-bazaar --restart unless-stopped -p 8080:8080 -e NODE_ENV=production -e PORT=8080 -e FIREBASE_PROJECT_ID=gen-lang-client-0793173009 -e FIRESTORE_DATABASE_ID=ai-studio-07331219-f7ef-4e37-8b05-8dc2ef08e4a0 -e GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/firebase-admin.json -v /home/ubuntu/.secrets/firebase-admin.json:/run/secrets/firebase-admin.json:ro " + $image),
              "for i in $(seq 1 20); do if curl -fsS http://127.0.0.1:8080/api/health; then exit 0; fi; sleep 3; done",
              "docker logs --tail 80 halal-bazaar",
              "exit 1"
            ]
          }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Halal-Bazaar ${IMAGE_TAG}" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $COMMAND_ID"
          echo "Deploying image: $IMAGE"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS"

            if [[ "$STATUS" == "Success" ]]; then
              echo "Deployment completed successfully."
              exit 0
            fi

            case "$STATUS" in
              Failed|Cancelled|TimedOut)
                echo "Deployment failed. Retrieving command output..."
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "{Status:Status,Details:StatusDetails,Output:StandardOutputContent,Error:StandardErrorContent}" \
                  --output json || true
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for Systems Manager deployment."
          exit 1
